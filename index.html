<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EarnFlow OS v3.0</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root { --bg: #010206; --accent: #00ffa3; --text: #f0f4f8; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; text-align: center; }
        .wallet { margin: 40px auto; padding: 30px; background: rgba(10,15,28,0.9); border-radius: 30px; width: 85%; border: 1px solid rgba(255,255,255,0.05); }
        .pts { font-size: 4rem; font-weight: 900; color: var(--accent); }
        .uid { font-size: 0.6rem; color: #4a5568; margin-top: 10px; }
        #assetGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 20px; }
        .card { background: rgba(255,255,255,0.03); padding: 20px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body>
    <header style="padding:20px; color:var(--accent); font-weight:bold;">EARNFLOW OS v3.0</header>
    
    <div class="wallet">
        <div style="font-size:0.7rem; color:#718096;">CURRENT BALANCE</div>
        <div class="pts" id="balance">0</div>
        <div id="userIdDisplay" class="uid">ID: Loading...</div>
    </div>

    <div id="assetGrid"></div>
    <button onclick="localStorage.clear(); location.reload();" style="background:none; border:none; color:#333; font-size:10px;">Reset Device Data</button>

    <script>
        // --- YOUR CORE LINKS ---
        const webHook = "https://script.google.com/macros/s/AKfycbzfxP_BcL-5meqL5Kr-Xakyfh3oRvqxb2sGP1gO-9iTC6CVDSo4NqlPxt1USxTpUEDi9Q/exec";
        const adLink = "https://www.profitablecpmratenetwork.com/tmit15ri4?key=43c4129bda0d3aa9e82a122ef3875019";

        // 1. GENERATE OR RETRIEVE UNIQUE USER ID
        let userId = localStorage.getItem('earnflow_uid');
        if (!userId) {
            userId = 'USER-' + Math.random().toString(36).substr(2, 9).toUpperCase();
            localStorage.setItem('earnflow_uid', userId);
        }
        document.getElementById('userIdDisplay').innerText = "DEVICE ID: " + userId;

        // 2. LOAD SAVED POINTS
        let currentPoints = parseInt(localStorage.getItem('earnflow_pts')) || 0;
        updateUI();

        function updateUI() {
            document.getElementById('balance').innerText = currentPoints.toLocaleString();
            localStorage.setItem('earnflow_pts', currentPoints);
        }

        function syncToSheet(pointsAdded) {
            fetch(webHook, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({
                    uid: userId,
                    added: pointsAdded,
                    total: currentPoints,
                    admin: pointsAdded * 0.05,
                    founder: pointsAdded * 0.95,
                    source: window.location.hostname
                })
            });
        }

        function earn(amount) {
            currentPoints += amount;
            updateUI();
            syncToSheet(amount);
            window.open(adLink, "_blank");
        }

        // 3. GENERATE ASSETS
        const assets = [{n:"Equity", p:350}, {n:"Gold", p:280}, {n:"Tech", p:240}, {n:"Estate", p:400}];
        assets.forEach(a => {
            document.getElementById("assetGrid").innerHTML += `
                <div class="card" onclick="earn(${a.p})">
                    <b style="font-size:1.1rem;">${a.n}</b><br/>
                    <span style="color:var(--accent); font-weight:900;">+${a.p}</span>
                </div>`;
        });
    </script>
</body>
</html>
