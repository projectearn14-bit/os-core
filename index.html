<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EarnFlow Pay | Multi-Bill Cart</title>
    <style>
        :root { --bg: #f4f7f6; --card: #ffffff; --accent: #2962ff; --text: #102a43; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        h2, h3 { margin-top: 0; }
        
        /* The Goal Setter */
        .goal-box { border: 2px dashed var(--accent); padding: 15px; border-radius: 8px; text-align: center; background: #eef2ff; }
        
        /* The Cart */
        .cart-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; }
        button { background: var(--accent); color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .add-btn { background: #e0e7ff; color: var(--accent); width: auto; padding: 8px 15px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>EarnFlow Pay</h2>
        
        <div class="card goal-box">
            <h3>Your Withdrawal Goal</h3>
            <p>You cannot withdraw cash. Select a goal to unlock your EarnFlow Hub points.</p>
            <select id="goalSelect" style="padding: 10px; width: 100%; border-radius: 5px;">
                <option value="flight">MakeMyTrip Flight Booking (₹5,000)</option>
                <option value="amazon">Amazon Shopping Voucher (₹2,000)</option>
                <option value="electricity">TSSPDCL Electricity Bill (Variable)</option>
            </select>
            <p style="font-size: 12px; color: #666;">Current EarnFlow Balance: <b>₹<span id="efBal">0</span></b></p>
        </div>

        <div class="card">
            <h3>Bill Payment Cart</h3>
            <div id="cartList">
                <div class="cart-item"><span>Airtel Postpaid (9876543210)</span> <span>₹749</span></div>
                <div class="cart-item"><span>HDFC Credit Card</span> <span>₹4,500</span></div>
                <div class="cart-item"><span>Fasthub FASTag</span> <span>₹1,000</span></div>
            </div>
            <div class="cart-item" style="border:none; font-weight:bold; font-size: 18px; margin-top: 10px;">
                <span>Total to Pay:</span> <span>₹6,249</span>
            </div>
            
            <button onclick="checkoutCart()">Pay All Bills in One Shot</button>
        </div>
    </div>

    <script>
        const webHook = "YOUR_SCRIPT_URL_HERE"; // Same URL as App 1
        
        // Pull balance from App 1 via LocalStorage (if on same domain)
        let pts = parseInt(localStorage.getItem('earnflow_pts')) || 15000; 
        document.getElementById('efBal').innerText = (pts * 0.01).toFixed(2);

        function checkoutCart() {
            let uid = localStorage.getItem('ef_uid') || "GUEST_USER";
            
            // Send cart data to Google Sheets
            fetch(webHook, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({
                    type: "CHECKOUT_CART",
                    uid: uid,
                    cartItems: "Airtel, HDFC, FASTag",
                    totalCost: 6249
                })
            });
            
            alert("Payment Processing! Founder just earned an API Commission.");
        }
    </script>
</body>
</html>
