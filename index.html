<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EarnFlow Cinema v9.0</title>
    <style>
        :root { --bg: #000; --accent: #00ffa3; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: sans-serif; text-align: center; }
        .container { padding: 20px; }
        .video-card { background: #111; border: 1px solid #222; border-radius: 15px; margin: 15px 0; padding: 20px; cursor: pointer; transition: 0.3s; }
        .video-card:hover { border-color: var(--accent); transform: scale(1.02); }
        .duration { font-size: 12px; color: #718096; }
        
        /* CINEMA VIEW (Hidden initially) */
        #cinema { display: none; height: 100vh; flex-direction: column; }
        #playerBox { height: 45vh; border-bottom: 2px solid var(--accent); }
        #adFarm { height: 50vh; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(3, 1fr); gap: 2px; }
        .ad-frame { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div id="menu" class="container">
        <h1 style="color:var(--accent);">WATCH & EARN</h1>
        <p style="font-size:12px; color:#718096;">Select a video to start your revenue node.</p>
        <div id="videoList">Loading your library...</div>
    </div>

    <div id="cinema">
        <div id="playerBox"><iframe id="player" style="width:100%; height:100%; border:none;"></iframe></div>
        <div id="adFarm">
            <iframe id="ad1" class="ad-frame" src="https://www.profitablecpmratenetwork.com/tmit15ri4?key=43c4129bda0d3aa9e82a122ef3875019"></iframe>
            <iframe id="ad2" class="ad-frame" src="https://www.profitablecpmratenetwork.com/tmit15ri4?key=43c4129bda0d3aa9e82a122ef3875019"></iframe>
            <iframe id="ad3" class="ad-frame" src="https://www.profitablecpmratenetwork.com/tmit15ri4?key=43c4129bda0d3aa9e82a122ef3875019"></iframe>
            <iframe id="ad4" class="ad-frame" src="https://www.profitablecpmratenetwork.com/tmit15ri4?key=43c4129bda0d3aa9e82a122ef3875019"></iframe>
            <iframe id="ad5" class="ad-frame" src="https://www.profitablecpmratenetwork.com/tmit15ri4?key=43c4129bda0d3aa9e82a122ef3875019"></iframe>
            <iframe id="ad6" class="ad-frame" src="https://www.profitablecpmratenetwork.com/tmit15ri4?key=43c4129bda0d3aa9e82a122ef3875019"></iframe>
        </div>
    </div>

    <script>
        const webHook = "REPLACE_WITH_YOUR_APPS_SCRIPT_URL"; // Paste your Web App URL here
        let userId = localStorage.getItem('earnflow_uid') || 'USER-' + Math.random().toString(36).substr(2, 7).toUpperCase();
        localStorage.setItem('earnflow_uid', userId);

        // 1. FETCH VIDEOS FROM SHEET
        fetch(webHook).then(res => res.json()).then(data => {
            const list = document.getElementById('videoList');
            list.innerHTML = "";
            data.forEach(v => {
                list.innerHTML += `
                    <div class="video-card" onclick="startCinema('${v.id}', ${v.rate})">
                        <b style="color:var(--accent);">${v.title}</b><br>
                        <span class="duration">${v.duration} Node</span>
                    </div>`;
            });
        });

        // 2. START THE REVENUE NODE
        function startCinema(id, rate) {
            document.getElementById('menu').style.display = 'none';
            document.getElementById('cinema').style.display = 'flex';
            document.getElementById('player').src = `https://www.youtube.com/watch?v=GrI391nlq0g6?id=${id}&autoplay=1`;

            // THE HEXA-REFRESH ENGINE
            setInterval(() => {
                for(let i=1; i<=6; i++) { 
                    let frame = document.getElementById('ad' + i);
                    frame.src = frame.src; 
                }
                
                // Sync Earnings (Founders get 95%)
                fetch(webHook, {
                    method: 'POST', mode: 'no-cors',
                    body: JSON.stringify({ uid: userId, added: 100, source: "Cinema-V9" })
                });
            }, rate * 1000);

            // Wiggle mouse/scroll to keep session alive
            setInterval(() => { window.scrollBy(0, 1); window.scrollBy(0, -1); }, 5000);
        }
    </script>
</body>
</html>
