<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EarnFlow OS</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <style>
        :root { --bg: #010206; --accent: #00ffa3; --text: #f0f4f8; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; text-align: center; }
        header { padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); font-weight: 900; color: var(--accent); }
        .wallet { margin: 80px auto; padding: 40px; background: rgba(10,15,28,0.9); border-radius: 30px; width: 85%; border: 1px solid rgba(255,255,255,0.05); }
        .pts { font-size: 4rem; font-weight: 900; margin: 10px 0; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 20px; }
        .card { background: rgba(255,255,255,0.03); padding: 25px 10px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); cursor: pointer; }
        #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.98); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; backdrop-filter: blur(20px); }
    </style>
</head>
<body onclick="resetIdle()">
    <header>EARNFLOW OS <span style="font-weight:100; color:#fff;">v2.6</span></header>
    
    <div class="wallet">
        <div style="font-size:0.7rem; letter-spacing:4px; color:#718096;">YOUR EARNINGS</div>
        <div class="pts" id="balance">0</div>
        <div style="color:var(--accent); font-weight:bold;">≈ ₹<span id="rupee">0.00</span></div>
    </div>

    <div class="grid" id="assetGrid"></div>

    <div id="overlay">
        <h2 style="color:var(--accent);">SYNC PAUSE</h2>
        <p style="color:#718096; margin-bottom:30px;">Verify session for Founder Tier Bonus</p>
        <a id="verifyLink" href="#" target="_blank" style="color:#fff; padding:20px 40px; border:1px solid var(--accent); border-radius:50px; text-decoration:none; font-weight:900;">CLICK TO VERIFY</a>
        <button onclick="resume()" style="margin-top:25px; background:var(--accent); border:none; padding:15px 30px; border-radius:50px; font-weight:bold;">RESUME SESSION</button>
    </div>

    <script>
        // --- PASTE YOUR LINKS HERE ---
        const webHook = "https://script.google.com/macros/s/AKfycbzfxP_BcL-5meqL5Kr-Xakyfh3oRvqxb2sGP1gO-9iTC6CVDSo4NqlPxt1USxTpUEDi9Q/exec"; 
        const directLink = "https://www.profitablecpmratenetwork.com/tmit15ri4?key=43c4129bda0d3aa9e82a122ef3875019";
        // -----------------------------

        document.getElementById("verifyLink").href = directLink;
        let pts = 0, idle = 0, isBreak = false;

        function sync(val) {
            if(webHook.includes("http")) {
                fetch(webHook, { 
                    method: 'POST', 
                    mode: 'no-cors', 
                    body: JSON.stringify({ 
                        points: pts, 
                        admin: val * 0.05, 
                        founder: isBreak ? val * 0.95 : val * 0.9, 
                        source: window.location.hostname 
                    })
                });
            }
        }

        function trigger(p) {
            pts += p; 
            document.getElementById("balance").innerText = pts.toLocaleString();
            document.getElementById("rupee").innerText = (pts * 0.15).toFixed(2);
            sync(p); 
            window.open(directLink, "_blank");
        }

        function resetIdle() { idle = 0; }
        function resume() { isBreak = true; resetIdle(); document.getElementById("overlay").style.display = "none"; }
        
        setInterval(() => { 
            idle++; 
            if(idle >= 60) document.getElementById("overlay").style.display = "flex"; 
        }, 60000);

        const assets = [{n:"Equity", p:350}, {n:"Gold", p:280}, {n:"Tech", p:240}, {n:"Estate", p:400}];
        assets.forEach(a => {
            document.getElementById("assetGrid").innerHTML += `
                <div class="card" onclick="trigger(${a.p})">
                    <div style="font-size:0.6rem; color:var(--accent);">ASSET</div>
                    <b>${a.n}</b><br/>
                    <span style="color:var(--accent); font-weight:900;">+${a.p}</span>
                </div>`;
        });
    </script>
</body>
</html>
