<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinema Hub | Premium Streaming</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        :root { --yt-bg: #0f0f0f; --yt-card: #1e1e1e; --yt-red: #ff0000; --yt-text: #ffffff; --accent: #00ffa3; }
        body { margin: 0; background: var(--yt-bg); color: var(--yt-text); font-family: 'Roboto', sans-serif; overflow-x: hidden; }
        
        /* HEADER */
        header { height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; position: sticky; top: 0; background: var(--yt-bg); z-index: 1000; }
        .logo-box { display: flex; align-items: center; cursor: pointer; }
        .logo-box span { color: var(--yt-red); font-size: 30px; margin-right: 5px; }
        .search-bar { background: #121212; border: 1px solid #333; border-radius: 40px; width: 40%; height: 36px; display: flex; align-items: center; padding: 0 15px; color: #888; font-size: 14px; }
        .user-icons { display: flex; gap: 20px; align-items: center; }

        /* VIDEO GALLERY */
        #gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; padding: 20px; }
        .v-card { cursor: pointer; border-radius: 12px; overflow: hidden; background: transparent; transition: 0.2s; }
        .v-card:hover { transform: translateY(-3px); }
        .v-thumb { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 12px; background: #222; }
        .v-details { display: flex; gap: 12px; padding: 12px 5px; }
        .v-avatar { width: 36px; height: 36px; border-radius: 50%; background: #333; }
        .v-title { font-weight: 600; font-size: 15px; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .v-stats { color: #aaa; font-size: 12px; }

        /* REVENUE PLAYER VIEW */
        #playerView { display: none; background: #000; height: 100vh; flex-direction: column; }
        #videoFrame { width: 100%; height: 45vh; background: #000; border-bottom: 2px solid var(--accent); }
        #adGrid { height: 50vh; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: 1fr 1fr; gap: 5px; padding: 5px; }
        .ad-node { width: 100%; height: 100%; border: none; background: #050505; }

        /* STEALTH SEO PAGE (Hidden) */
        #stealthHub { display: none; position: fixed; inset: 0; background: #fff; color: #fff; z-index: 9999; padding: 50px; overflow-y: scroll; font-size: 5px; }
        .keyword-stack { opacity: 0.01; } /* Invisible to humans, visible to Google Bots */

        /* FOOTER HUD */
        #hud { position: fixed; bottom: 0; width: 100%; background: rgba(0,0,0,0.9); height: 40px; display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--accent); border-top: 1px solid #222; }
    </style>
</head>
<body>

    <header>
        <div class="logo-box" onclick="location.reload()">
            <span class="material-symbols-outlined">play_circle</span>
            <div style="font-weight: 900; letter-spacing: -1px; font-size: 18px;">EarnFlow</div>
        </div>
        <div class="search-bar">Search videos...</div>
        <div class="user-icons">
            <span class="material-symbols-outlined">notifications</span>
            <div style="background: var(--accent); color: #000; padding: 2px 8px; border-radius: 20px; font-weight: bold; font-size: 12px;">₹<span id="bal">0.00</span></div>
        </div>
    </header>

    <div id="gallery"></div>

    <div id="playerView">
        <iframe id="videoFrame" allow="autoplay"></iframe>
        <div id="adGrid">
            <iframe class="ad-node" id="n1"></iframe><iframe class="ad-node" id="n2"></iframe>
            <iframe class="ad-node" id="n3"></iframe><iframe class="ad-node" id="n4"></iframe>
            <iframe class="ad-node" id="n5"></iframe><iframe class="ad-node" id="n6"></iframe>
            <iframe class="ad-node" id="n7"></iframe><iframe class="ad-node" id="n8"></iframe>
        </div>
    </div>

    <div id="stealthHub">
        <h1>EarnFlow Cinema | Watch Mahabharata Online | Free Meditation Music | Jiddu Krishnamurti Talks | Vedic Wisdom | Passive Income Apps India</h1>
        <div id="keywordAutomation" class="keyword-stack"></div>
    </div>

    <div id="hud" onclick="handleStealthClick()">
        v12.0 ENGINE ACTIVE • HANDSHAKE SYNCED • <span id="clickCount">0</span>
    </div>

    <script>
        const webHook = "YOUR_APPS_SCRIPT_URL_HERE"; 
        const adLink = "https://www.profitablecpmratenetwork.com/tmit15ri4?key=43c4129bda0d3aa9e82a122ef3875019";
        
        let userId = localStorage.getItem('earnflow_uid') || 'U-' + Math.random().toString(36).substr(2, 6).toUpperCase();
        localStorage.setItem('earnflow_uid', userId);
        
        let pts = parseInt(localStorage.getItem('earnflow_pts')) || 0;
        document.getElementById('bal').innerText = (pts * 0.01).toFixed(2);

        // 1. FETCH VIDEOS
        fetch(webHook).then(r => r.json()).then(data => {
            const container = document.getElementById('gallery');
            data.forEach(v => {
                container.innerHTML += `
                    <div class="v-card" onclick="launchNode('${v.id}', ${v.rate})">
                        <img class="v-thumb" src="https://img.youtube.com/vi/${v.id}/maxresdefault.jpg">
                        <div class="v-details">
                            <div class="v-avatar"></div>
                            <div>
                                <div class="v-title">${v.title}</div>
                                <div class="v-stats">${v.duration} • 95% Founder Tier Node</div>
                            </div>
                        </div>
                    </div>`;
            });
        });

        // 2. LAUNCH REVENUE MODE
        function launchNode(vid, rate) {
            document.getElementById('gallery').style.display = 'none';
            document.getElementById('playerView').style.display = 'flex';
            document.getElementById('videoFrame').src = `https://www.youtube.com/embed/${vid}?autoplay=1&mute=1`;
            
            // Activate Hexa-Ad Nodes
            for(let i=1; i<=8; i++) document.getElementById('n'+i).src = adLink;

            setInterval(() => {
                for(let i=1; i<=8; i++) { let f = document.getElementById('n'+i); f.src = f.src; }
                pts += 150;
                localStorage.setItem('earnflow_pts', pts);
                document.getElementById('bal').innerText = (pts * 0.01).toFixed(2);
                
                fetch(webHook, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ uid: userId, added: 150, total: pts, source: "Cinema_V12" })});
            }, rate * 1000);

            // AUTO-HANDSHAKE (Anti-Idle)
            setInterval(() => { window.scrollBy(0,1); setTimeout(()=>window.scrollBy(0,-1),100); }, 15000);
        }

        // 3. STEALTH MODE TRIGGER (Click HUD 5 times)
        let clicks = 0;
        function handleStealthClick() {
            clicks++;
            document.getElementById('clickCount').innerText = clicks;
            if(clicks >= 5) {
                document.getElementById('stealthHub').style.display = 'block';
                startKeywordAutomation();
            }
        }

        function startKeywordAutomation() {
            const keywords = ["Mahabharata episodes", "Jiddu Krishnamurti wisdom", "Vedic stories", "Bhakti stotras", "passive income India", "earn money online", "meditation 12 hours", "sleeping music"];
            const stack = document.getElementById('keywordAutomation');
            setInterval(() => {
                const randomKW = keywords[Math.floor(Math.random() * keywords.length)];
                stack.innerHTML += randomKW + " ";
                if(stack.innerText.length > 5000) stack.innerHTML = ""; // Reset to prevent lag
            }, 1000);
        }
    </script>
</body>
</html>
