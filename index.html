<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EarnFlow Cinema Hub</title>
    <style>
        :root { --bg: #0f0f0f; --accent: #00ffa3; --card: #1e1e1e; --yt-red: #ff0000; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: "Roboto", sans-serif; }
        header { height: 60px; background: var(--bg); display: flex; align-items: center; padding: 0 20px; border-bottom: 1px solid #333; position: sticky; top:0; z-index:100; justify-content: space-between; }
        .logo { font-weight: bold; font-size: 20px; }
        .logo span { background: var(--yt-red); padding: 2px 6px; border-radius: 4px; margin-right: 5px; }
        
        /* GALLERY VIEW */
        #gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; padding: 20px; }
        .v-card { cursor: pointer; border-radius: 12px; overflow: hidden; background: var(--card); transition: 0.3s; }
        .v-card:hover { transform: translateY(-5px); border: 1px solid var(--accent); }
        .thumb { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: #333; }
        .v-meta { padding: 12px; }
        .v-title { font-weight: bold; font-size: 14px; margin-bottom: 5px; }
        .v-duration { color: #aaa; font-size: 12px; }

        /* PLAYER VIEW (AUTO-REVENUE MODE) */
        #playerView { display: none; flex-direction: column; height: 100vh; }
        #videoContainer { height: 45vh; background: #000; border-bottom: 2px solid var(--accent); }
        #adStack { height: 50vh; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: 1fr 1fr; gap: 5px; padding: 5px; background: #050505; }
        .ad-slot { width: 100%; height: 100%; border: none; background: #111; }
        
        /* HUD & HANDSHAKE */
        #hud { position: fixed; bottom: 10px; right: 10px; background: rgba(0,0,0,0.8); padding: 10px 20px; border-radius: 50px; font-size: 12px; border: 1px solid var(--accent); z-index: 1000; }
        #handshakeMsg { font-size: 8px; color: var(--accent); margin-top: 5px; text-align: center; }
    </style>
</head>
<body>

    <header>
        <div class="logo"><span>Earn</span>Flow Hub</div>
        <div style="font-size: 14px; color:var(--accent);">₹<span id="bal">0.00</span></div>
    </header>

    <div id="gallery"></div>

    <div id="playerView">
        <div id="videoContainer">
            <iframe id="mainVid" style="width:100%; height:100%; border:none;" allow="autoplay"></iframe>
        </div>
        <div id="adStack">
            <iframe class="ad-slot" id="a1"></iframe><iframe class="ad-slot" id="a2"></iframe>
            <iframe class="ad-slot" id="a3"></iframe><iframe class="ad-slot" id="a4"></iframe>
            <iframe class="ad-slot" id="a5"></iframe><iframe class="ad-slot" id="a6"></iframe>
            <iframe class="ad-slot" id="a7"></iframe><iframe class="ad-slot" id="a8"></iframe>
        </div>
    </div>

    <div id="hud" style="display:none;">
        REVENUE ACTIVE <div id="handshakeMsg">SYNCING...</div>
    </div>

    <script>
        const webHook = "PASTE_YOUR_SCRIPT_URL_HERE"; 
        const adLink = "https://www.profitablecpmratenetwork.com/tmit15ri4?key=43c4129bda0d3aa9e82a122ef3875019";
        
        let userId = localStorage.getItem('earnflow_uid') || 'U-' + Math.random().toString(36).substr(2, 6).toUpperCase();
        localStorage.setItem('earnflow_uid', userId);
        
        let pts = parseInt(localStorage.getItem('earnflow_pts')) || 0;
        document.getElementById('bal').innerText = (pts * 0.01).toFixed(2);

        // 1. DYNAMICALLY BUILD GALLERY FROM SHEET
        fetch(webHook).then(r => r.json()).then(data => {
            const container = document.getElementById('gallery');
            data.forEach(v => {
                container.innerHTML += `
                    <div class="v-card" onclick="startNode('${v.id}', ${v.rate})">
                        <img class="thumb" src="https://img.youtube.com/vi/${v.id}/mqdefault.jpg">
                        <div class="v-meta">
                            <div class="v-title">${v.title}</div>
                            <div class="v-duration">${v.duration} Continuous Node</div>
                        </div>
                    </div>`;
            });
        });

        // 2. THE REVENUE ENGINE (AUTO-HANDSHAKE)
        function startNode(vidId, rate) {
            document.getElementById('gallery').style.display = 'none';
            document.getElementById('playerView').style.display = 'flex';
            document.getElementById('hud').style.display = 'block';
            
            // Start Video
            document.getElementById('mainVid').src = `https://www.youtube.com/embed/${vidId}?autoplay=1&mute=1`;
            
            // Prime 8 Ad Nodes
            for(let i=1; i<=8; i++) document.getElementById('a'+i).src = adLink;

            // REVENUE LOOP
            setInterval(() => {
                // Refresh 8 Ads Simultaneously
                for(let i=1; i<=8; i++) { let f = document.getElementById('a'+i); f.src = f.src; }
                
                // Add Points & Sync
                pts += 150;
                localStorage.setItem('earnflow_pts', pts);
                document.getElementById('bal').innerText = (pts * 0.01).toFixed(2);

                fetch(webHook, {
                    method: 'POST', mode: 'no-cors',
                    body: JSON.stringify({ uid: userId, added: 150, total: pts, source: "Cinema_V11" })
                });
            }, rate * 1000);

            // AUTO-HANDSHAKE (Anti-Idle Movement)
            setInterval(() => {
                window.scrollBy(0, 1);
                setTimeout(() => window.scrollBy(0, -1), 100);
                document.getElementById('handshakeMsg').innerText = "HANDSHAKE: " + new Date().toLocaleTimeString();
            }, 10000);
        }
    </script>
</body>
</html>
