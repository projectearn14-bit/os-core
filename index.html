<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>EarnFlow Hub | Premium Streaming</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        :root { --bg: #0f0f0f; --card: #1e1e1e; --accent: #00ffa3; --red: #ff0000; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Roboto', sans-serif; overflow-x: hidden; }
        header { height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: var(--bg); position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid #333; }
        .logo { display: flex; align-items: center; cursor: pointer; font-weight: 900; font-size: 20px; }
        .logo span { color: var(--red); font-size: 30px; margin-right: 5px; }
        #gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; padding: 20px; }
        .v-card { cursor: pointer; border-radius: 12px; transition: 0.2s; background: var(--card); overflow: hidden; }
        .v-card:hover { transform: translateY(-3px); border: 1px solid var(--accent); }
        .thumb { width: 100%; aspect-ratio: 16/9; object-fit: cover; }
        #cinema { display: none; flex-direction: column; height: 100vh; background: #000; }
        #adGrid { height: 50vh; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 4px; }
        .ad-node { width: 100%; height: 100%; border: none; background: #050505; }
        #stealthHub { display: none; position: fixed; inset: 0; background: #fff; color: #fff; z-index: 9999; font-size: 1px; opacity: 0.01; pointer-events: none; }
    </style>
</head>
