<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EarnFlow Cinema v10.0</title>
    <style>
        :root { --yt-red: #ff0000; --bg: #0f0f0f; --card-bg: #1e1e1e; --accent: #00ffa3; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: "Roboto", Arial, sans-serif; overflow-x: hidden; }
        
        /* HEADER */
        header { height: 60px; background: var(--bg); display: flex; align-items: center; padding: 0 20px; border-bottom: 1px solid #333; position: sticky; top:0; z-index:100; justify-content: space-between; }
        .logo { font-weight: bold; font-size: 20px; letter-spacing: -1px; }
        .logo span { background: var(--yt-red); padding: 2px 6px; border-radius: 4px; margin-right: 5px; }

        /* GALLERY GRID */
        #gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; padding: 20px; }
        .v-card { cursor: pointer; transition: 0.2s; }
        .v-card:hover { transform: scale(1.02); }
        .thumb { width: 100%; aspect-ratio: 16/9; background: #333; border-radius: 12px; object-fit: cover; }
        .v-info { padding: 10px 0; display: flex; gap: 10px; }
        .v-title { font-weight: bold; font-size: 16px; line-height: 1.4; color: #fff; }
        .v-meta { color: #aaa; font-size: 12px; margin-top: 4px; }

        /* CINEMA VIEW */
        #cinema { display: none; flex-direction: column; height: 100vh; }
        #playerBox { width: 100%; height: 50vh; background: #000; position: relative; }
        #adGrid { height: 45vh; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: 1fr 1fr; gap: 4px; padding: 4px; background: #000; }
        .ad-frame { width: 100%; height: 100%; border: none; background: #111; }

        /* AUTO HANDSHAKE NOTIFIER */
        #handshake { position: fixed; bottom: 10px; left: 10px; font-size: 9px; color: var(--accent); opacity: 0.5; }
    </style>
</head>
<body>

    <header>
        <div class="logo"><span>Earn</span>Flow Cinema</div>
        <div id="userStats" style="font-size: 12px; color: var(--accent);">BAL: ₹<span id="balDisplay">0.00</span></div>
    </header>

    <div id="gallery"></div>

    <div id="cinema">
        <div id="playerBox">
            <iframe id="mainPlayer" style="width:100%; height:100%; border:none;" allow="autoplay"></iframe>
        </div>
        <div id="adGrid">
            <iframe id="ad1" class="ad-frame"></iframe><iframe id="ad2" class="ad-frame"></iframe>
            <iframe id="ad3" class="ad-frame"></iframe><iframe id="ad4" class="ad-frame"></iframe>
            <iframe id="ad5" class="ad-frame"></iframe><iframe id="ad6" class="ad-frame"></iframe>
            <iframe id="ad7" class="ad-frame"></iframe><iframe id="ad8" class="ad-frame"></iframe>
        </div>
    </div>

    <div id="handshake">ESTABLISHING HANDSHAKE...</div>

    <script>
        const webHook = "YOUR_APPS_SCRIPT_URL"; // PASTE YOUR URL HERE
        const adLink = "https://www.profitablecpmratenetwork.com/tmit15ri4?key=43c4129bda0d3aa9e82a122ef3875019";
        
        let userId = localStorage.getItem('earnflow_uid') || 'U-' + Math.random().toString(36).substr(2, 6).toUpperCase();
        localStorage.setItem('earnflow_uid', userId);

        let currentPts = parseInt(localStorage.getItem('earnflow_pts')) || 0;
        document.getElementById('balDisplay').innerText = (currentPts * 0.01).toFixed(2);

        // 1. FETCH VIDEOS AND BUILD YOUTUBE GRID
        fetch(webHook).then(res => res.json()).then(videos => {
            const gallery = document.getElementById('gallery');
            videos.forEach(v => {
                const thumb = `https://img.youtube.com/vi/${v.id}/maxresdefault.jpg`;
                gallery.innerHTML += `
                    <div class="v-card" onclick="startCinema('${v.id}', ${v.rate})">
                        <img src="${thumb}" class="thumb">
                        <div class="v-info">
                            <div>
                                <div class="v-title">${v.title}</div>
                                <div class="v-meta">${v.duration} • Rewarded Node</div>
                            </div>
                        </div>
                    </div>`;
            });
        });

        // 2. THE CINEMA ENGINE
        function startCinema(vidId, rate) {
            document.getElementById('gallery').style.display = 'none';
            document.getElementById('cinema').style.display = 'flex';
            document.getElementById('mainPlayer').src = `https://www.youtube.com/embed/jfKfPfyJRdk?autoplay=1&mute=1&loop=13{vidId}&autoplay=1`;
            
            // Set initial Ad sources
            for(let i=1; i<=8; i++) document.getElementById('ad'+i).src = adLink;

            // THE REVENUE CYCLE
            setInterval(() => {
                // Refresh 8 Ads
                for(let i=1; i<=8; i++) { let a = document.getElementById('ad'+i); a.src = a.src; }
                
                // Add Points (150 pts per refresh)
                currentPts += 150;
                localStorage.setItem('earnflow_pts', currentPts);
                document.getElementById('balDisplay').innerText = (currentPts * 0.01).toFixed(2);

                // Sync to Triple Ledger (User / Founder 95% / App 5%)
                fetch(webHook, {
                    method: 'POST', mode: 'no-cors',
                    body: JSON.stringify({ uid: userId, added: 150, total: currentPts, source: "Cinema_V10" })
                });
            }, rate * 1000);

            // AUTO HANDSHAKE (Anti-Idle Movement)
            setInterval(() => {
                window.scrollBy(0, 2);
                setTimeout(() => window.scrollBy(0, -2), 100);
                document.getElementById('handshake').innerText = "HANDSHAKE SYNCED: " + new Date().toLocaleTimeString();
            }, 15000);
        }
    </script>
</body>
</html>
